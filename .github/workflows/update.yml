name: update-formula

on:
  schedule:
    - cron: "17 3 * * *" # daily, after most people tag releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula from the latest tfw release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-formula.py

      - name: Commit if the formula changed
        run: |
          if git diff --quiet -- Formula/tfw.rb; then
            echo "no formula change"
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/tfw.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tfw.rb
          git commit -m "tfw: update formula to ${version}"
          git push
